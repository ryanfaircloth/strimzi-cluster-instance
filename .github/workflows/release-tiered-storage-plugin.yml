name: Release tiered-storage plugin image

# Builds the plugin-only OCI image(s) for Kafka tiered storage.
#
# Publishes ONLY when the pinned plugin version changes: the workflow triggers
# on pushes that touch tiered-storage-plugin/** (Renovate bumps PLUGIN_VERSION),
# and each matrix leg skips if its "<cloud>-<version>" tag already exists.
on:
  push:
    branches: [main, feat/tiered-storage-image-override] # TEMP: verify build+publish before merge
    paths:
      - "tiered-storage-plugin/**"
      - ".github/workflows/release-tiered-storage-plugin.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if the image tag already exists"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kafka-tiered-storage-plugin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only AWS is built today. Uncomment a cloud below to start publishing it.
          - cloud: aws
            module: s3
          # - cloud: azure
          #   module: azure
          # - cloud: gcs
          #   module: gcs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned plugin version
        id: plugin
        run: |
          VERSION="$(grep -v '^#' tiered-storage-plugin/PLUGIN_VERSION | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read a version from tiered-storage-plugin/PLUGIN_VERSION"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"

      - name: Compute image reference
        id: img
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.cloud }}-${{ steps.plugin.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: exists
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force requested — will rebuild."
          elif docker manifest inspect "${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }} already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: tiered-storage-plugin
          file: tiered-storage-plugin/Dockerfile
          # Brokers may run on either arch (chart defaultArchitecture is arm64);
          # emit a manifest list so the image volume resolves on any node.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PLUGIN_VERSION=${{ steps.plugin.outputs.version }}
            MODULE=${{ matrix.module }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.image }}:${{ matrix.cloud }}-latest
          # Keep a clean multi-arch manifest list (no attestation/SBOM child
          # manifests) so kubelet image-volume pulls resolve unambiguously.
          provenance: false
          sbom: false
